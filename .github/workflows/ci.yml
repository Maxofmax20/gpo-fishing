name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality-gates:
    uses: ./.github/workflows/quality.yml

  # GitHub caches are scoped to refs. Warm the production cache on the default
  # branch so future release tags can restore it; a previous tag's cache is not
  # visible to the next tag.
  production-cache:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        id: production_cache
        with:
          workspaces: src-tauri -> target
          shared-key: windows-release-v1
          prefix-key: v1-complete-rust
          cache-on-failure: false
      # Exact hits already came from a successful build. Do not relink the
      # entire ONNX/Tauri binary merely to save the same immutable cache key.
      - run: npm ci
        if: steps.production_cache.outputs.cache-hit != 'true'
      - run: npm run build
        if: steps.production_cache.outputs.cache-hit != 'true'
      - name: Warm production dependency cache without publishing or signing
        if: steps.production_cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked
        working-directory: src-tauri
