name: Release build benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lto: fat, units: 1 }
          - { lto: thin, units: 4 }
          - { lto: thin, units: 8 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: benchmark-${{ matrix.lto }}-${{ matrix.units }}
      - run: npm ci
      - run: npm run build
      - name: Three warm application rebuilds
        shell: pwsh
        run: ./scripts/benchmark-release.ps1 -Lto '${{ matrix.lto }}' -CodegenUnits ${{ matrix.units }} -Iterations 3
      - name: Source was restored
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.lto }}-${{ matrix.units }}
          path: benchmark-results/*.json
