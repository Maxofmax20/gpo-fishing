name: Shared quality checks

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Version consistency gate
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./scripts/check-versions.ps1 -Tag $env:RELEASE_TAG
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Dashboard gesture tests
        run: node --test src-tauri/src/bot/web/assets/gpo-touch.test.mjs src-tauri/src/bot/web/assets/gpo-system.test.mjs
      - run: npm audit --audit-level=high
      - name: Secret scan (gitleaks-style grep)
        shell: pwsh
        run: |
          $patterns = @(
            'TAURI_SIGNING_PRIVATE_KEY_PASSWORD\s*=\s*"[^"]+"',
            'discord\.com/api/webhooks/[A-Za-z0-9_\-/]+',
            'xox[bap]-',
            'AIza[0-9A-Za-z\-_]{20,}',
            '_ROBLOSECURITY_[A-Za-z0-9+/=]{20,}'
          )
          $hits = @()
          foreach ($p in $patterns) {
            $hits += Select-String -Path 'src/**/*','src-tauri/src/**/*','*.ps1','*.bat','.env*','src-tauri/.env*' -Pattern $p -ErrorAction SilentlyContinue |
              Where-Object { $_.Filename -notlike '*test*' -and $_.Line -notmatch 'synthetic-' }
          }
          if ($hits.Count -gt 0) { $hits | ForEach-Object { Write-Output "$($_.Path):$($_.LineNumber)" }; exit 1 }
          Write-Output "secret scan clean"

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ml/requirements-test.txt
            ml/requirements-training.txt
      - name: Install Python test dependencies
        run: python -m pip install -r ml/requirements-training.txt
      - name: Verify production training imports
        run: python -c "import torch,numpy,PIL,onnx,onnxruntime,onnxscript,ml.gpo_train.fish_train,ml.gpo_train.state_train"
      - name: Python regression tests
        run: python -m pytest ml/gpo_train/tests ml/gpo_ontology_review/tests ml/gpo_ocr_audit/tests ml/ram_plus/test_worker.py -q

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-tests-v1
          cache-on-failure: true
      - run: npm ci
      - run: npm run build
      - name: Rust tests
        run: cargo test --locked -j 2
        working-directory: src-tauri
      - name: Clippy (report)
        run: cargo clippy --locked --profile test --lib --tests --message-format short
        working-directory: src-tauri
