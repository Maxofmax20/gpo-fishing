name: Release

# Stable: tag vX.Y.Z (e.g. v4.3.0) — full release.
# Beta:   tag vX.Y.Z-beta.N (e.g. v4.3.0-beta.1) — marked prerelease.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reject invalid tags, missing notes or vulnerable dependencies before spending
  # time on a signed Windows build or creating any private draft.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Validate release version and notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/check-versions.ps1 -Tag $env:RELEASE_TAG
          if (-not (Test-Path "reports/RELEASE_NOTES_$env:RELEASE_TAG.md")) { throw 'Release notes missing' }
      - run: npm ci
      - run: npm audit --audit-level=high

  # All three independent suites run concurrently. Publication still waits
  # for every suite, and artifact signing/verification remain mandatory.
  quality-gates:
    uses: ./.github/workflows/quality.yml
    with:
      release_tag: ${{ github.ref_name }}

  # Build the private draft in parallel, but only publish after all gates pass.
  release:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore production Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-release-v1
          prefix-key: v1-complete-rust
          cache-on-failure: false

      - name: Install dependencies
        run: npm ci

      - name: Verify signing secret present (fail fast, never print it)
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) { Write-Error 'TAURI_SIGNING_PRIVATE_KEY secret is missing'; exit 1 }
          Write-Output 'signing key present'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # Build as a DRAFT. Publishing is a separate, later step, so a missing
      # signature or manifest fails the job BEFORE anything is public. v5.6.x
      # created a public release and only then verified the artifacts.
      - name: Build Tauri app (draft release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GPO Autofish ${{ github.ref_name }}'
          releaseBody: 'See release notes below. Auto-update verifies the minisign signature before installing.'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}

      - name: Verify updater artifacts exist
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          # Match the names GitHub exposes publicly before hashing or packing.
          Get-ChildItem $dir -File |
            Where-Object { $_.Name -match '_x64-setup\.exe(\.sig)?$' } |
            ForEach-Object {
              $canonicalName = $_.Name.Replace(' ', '.')
              if ($canonicalName -ne $_.Name) {
                Rename-Item -LiteralPath $_.FullName -NewName $canonicalName
              }
            }
          $exe = Get-ChildItem $dir -Filter '*_x64-setup.exe' | Select-Object -First 1
          if (-not $exe) { Write-Error 'signed installer missing'; exit 1 }
          if (-not (Test-Path "$dir/$($exe.BaseName).exe.sig")) { Write-Error 'updater signature missing'; exit 1 }
          & "$env:GITHUB_WORKSPACE/src-tauri/latest-json.ps1" -Out $dir
          if (-not (Test-Path "$dir/latest.json")) { Write-Error 'latest.json not generated'; exit 1 }
          # Independent checksums: minisign covers integrity of the update
          # itself, but a published SHA-256 lets a human verify the download
          # without trusting our tooling.
          Write-Output '### SHA-256' >> "$env:GITHUB_STEP_SUMMARY"
          $checksumLines = Get-ChildItem $dir -File |
            Where-Object { $_.Name -match '_x64-setup\.exe(\.sig)?$|^latest\.json$' } |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)"
            }
          $checksumLines | Set-Content "$dir/SHA256SUMS.txt" -Encoding utf8
          $checksumLines | Add-Content "$env:GITHUB_STEP_SUMMARY"
          Write-Output "updater artifacts verified for $($exe.Name)"

      - name: Retain verified artifacts for gated publication
        uses: actions/upload-artifact@v4
        with:
          name: verified-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [quality-gates, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-windows-installer
          path: verified
      - name: Publish only after every quality gate and signature check passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd verified
          sha256sum --check SHA256SUMS.txt
          for file in *_x64-setup.exe *_x64-setup.exe.sig latest.json SHA256SUMS.txt; do
            test -s "$file"
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done
          cd ..
          gh release edit "$RELEASE_TAG" --notes-file "reports/RELEASE_NOTES_$RELEASE_TAG.md" --draft=false
