name: Release

# Stable: tag vX.Y.Z (e.g. v4.3.0) — full release.
# Beta:   tag vX.Y.Z-beta.N (e.g. v4.3.0-beta.1) — marked prerelease.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Every gate below must pass — no continue-on-error on this path.
  quality-gates:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Version consistency gate (tag vs manifests)
        shell: pwsh
        run: ./scripts/check-versions.ps1 -Tag '${{ github.ref_name }}'

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend build (tsc --noEmit + vite build)
        run: npm run build

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

      - name: Clippy (report)
        run: cargo clippy --lib --tests --message-format short
        working-directory: src-tauri

      - name: npm audit (high+ fails release)
        run: npm audit --audit-level=high

  release:
    needs: quality-gates
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Verify signing secret present (fail fast, never print it)
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) { Write-Error 'TAURI_SIGNING_PRIVATE_KEY secret is missing'; exit 1 }
          Write-Output 'signing key present'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # Build as a DRAFT. Publishing is a separate, later step, so a missing
      # signature or manifest fails the job BEFORE anything is public. v5.6.x
      # created a public release and only then verified the artifacts.
      - name: Build Tauri app (draft release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GPO Autofish ${{ github.ref_name }}'
          releaseBody: 'See release notes below. Auto-update verifies the minisign signature before installing.'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}

      - name: Verify updater artifacts exist
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem $dir -Filter '*_x64-setup.exe' | Select-Object -First 1
          if (-not $exe) { Write-Error 'signed installer missing'; exit 1 }
          if (-not (Test-Path "$dir/$($exe.BaseName).exe.sig")) { Write-Error 'updater signature missing'; exit 1 }
          & "$env:GITHUB_WORKSPACE/src-tauri/latest-json.ps1" -Out $dir
          if (-not (Test-Path "$dir/latest.json")) { Write-Error 'latest.json not generated'; exit 1 }
          # Independent checksums: minisign covers integrity of the update
          # itself, but a published SHA-256 lets a human verify the download
          # without trusting our tooling.
          Write-Output '### SHA-256' >> "$env:GITHUB_STEP_SUMMARY"
          Get-ChildItem $dir -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "``$h  $($_.Name)``" | Tee-Object -FilePath "$dir/SHA256SUMS.txt" -Append | Out-Null
            "``$h  $($_.Name)``"
          } | Out-String | Add-Content "$env:GITHUB_STEP_SUMMARY"
          Write-Output "updater artifacts verified for $($exe.Name)"

      - name: Publish release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          $files = Get-ChildItem $dir -File |
            Where-Object { $_.Name -match '\.exe$|\.exe\.sig$|^latest\.json$|^SHA256SUMS\.txt$' }
          if (-not $files) { Write-Error 'no artifacts to publish'; exit 1 }
          foreach ($f in $files) {
            gh release upload '${{ github.ref_name }}' $f.FullName --clobber
            if ($LASTEXITCODE -ne 0) { Write-Error "upload failed: $($f.Name)"; exit 1 }
          }
          # Draft -> published only after every artifact is on the release.
          gh release edit '${{ github.ref_name }}' --draft=false
          if ($LASTEXITCODE -ne 0) { Write-Error 'failed to publish release'; exit 1 }
          Write-Output 'release published'
